[tox]
envlist =
    py38-django20
    py38-django21
    py38-django21-no-sites
    py38-django22
    py38-django22-no-sites
    py38-django30
    py38-django30-no-sites
    py38-django40
    py38-django40-no-sites
    py311-django41
    py311-django41-no-sites
    py311-django42
    py311-django42-no-sites

[testenv]
basepython = python3.11

[testenv:py38-django20]
deps = -rultracache/tests/requirements/20.txt
commands = python manage.py test ultracache.tests{posargs} --nomigrations --settings=ultracache.tests.settings.20

[testenv:py38-django21]
deps = -rultracache/tests/requirements/21.txt
commands = python manage.py test ultracache.tests{posargs} --nomigrations --settings=ultracache.tests.settings.21

[testenv:py38-django21-no-sites]
